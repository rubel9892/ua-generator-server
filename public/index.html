<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UA Generator</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0a0a0f] text-white">
<div class="max-w-4xl mx-auto p-4">
  <h1 class="text-2xl font-bold">User Agent Generator</h1>
  <p class="text-gray-400">100% unique & realistic</p>

  <div class="mt-6">
    <h2 class="font-semibold mb-2">📱 Device</h2>
    <div id="device" class="grid grid-cols-3 gap-2">
      <button data-val="iPhone" class="btn active">iPhone</button>
      <button data-val="Android" class="btn">Android</button>
      <button data-val="Windows" class="btn">Windows</button>
    </div>
  </div>

  <div class="mt-6">
    <h2 class="font-semibold mb-2">🌍 Country</h2>
    <div id="country" class="grid grid-cols-3 gap-2">
      <button data-val="USA" class="btn">USA</button>
      <button data-val="BD" class="btn active">Bangladesh</button>
      <button data-val="India" class="btn">India</button>
    </div>
  </div>

  <button id="generate" class="w-full bg-blue-600 py-3 mt-6 rounded-lg font-bold">Generate</button>
  <div id="results" class="mt-6 space-y-3"></div>
</div>

<style>.btn{background:#1a1a24;padding:10px;border-radius:8px}.btn.active{background:#2563eb}</style>

<script>
const API = "https://ua-generator-server.onrender.com/api/generate";
let selected = {device:"iPhone", country:"BD", qty:5};

document.querySelectorAll('.btn').forEach(b=>{
  b.onclick = () => {
    b.parentElement.querySelectorAll('.btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    selected[b.parentElement.id] = b.dataset.val;
  }
});

document.getElementById('generate').onclick = async () => {
  const url = `${API}?device=${selected.device}&country=${selected.country}&qty=${selected.qty}`;
  const res = await fetch(url);
  const data = await res.json();
  document.getElementById('results').innerHTML = data.ua.map((u,i)=>`
    <div class="bg-[#1a1a24] p-3 rounded"><div class="text-xs">${selected.device} ${selected.country} #${i+1}</div><pre class="text-xs">${u}</pre></div>
  `).join('');
}
</script>
</body>
</html>
